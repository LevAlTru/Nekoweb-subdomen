{{ define "body" }}

    <div class="changelog-wrapper">
        <div class="frame changelog-box golden">

            <div class="hz-flex flex-between">
                <h1>{{ .Title }}</h1>
                <a class="backbutton no-deco" href="../"><-</a>
            </div>

            {{ block "changelog-body" . }}
                {{ .Content }}
            {{ end }}

        </div>
    </div>

{{ end }}

{{ define "append_files" }}
    {{ .Store.Add "appended_css" (slice "common/changelogs") }}
{{ end }}
