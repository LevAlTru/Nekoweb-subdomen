<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
{{ if lt (strings.Count "" .Title) 3 }}
<title>LiesAboveTrust</title>
{{ else }}
<title>Lies - {{ .Title }}</title>
{{ end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" sizes="180x180" href="{{ (resources.Get `favicon/apple-touch-icon.png`).RelPermalink }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ (resources.Get `favicon/favicon-32x32.png`).RelPermalink }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ (resources.Get `favicon/favicon-16x16.png`).RelPermalink }}">
<link rel="manifest" href="{{ (resources.Get `favicon/site.webmanifest`).RelPermalink }}">
