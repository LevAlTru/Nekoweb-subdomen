{{- $text := .Get 0 -}}
{{- $col1 := .Get 1 -}}
{{- $col2 := .Get 2 -}}
{{- if and $col1 $col2 -}}
<span style="--sel-col: {{- $col2 -}}; color: {{- $col1 -}};">{{- $text -}}</span>
{{- else if $col1 -}}
<span style="--sel-col: {{- $col1 -}}; color: {{- $col1 -}};">{{- $text -}}</span>
{{- else if $col2 -}}
<span style="--sel-col: {{- $col2 -}};">{{- $text -}}</span>
{{- end -}}
